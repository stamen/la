<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Los Angeles buildings and parcels</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css">
  <script type="importmap">
    {
      "imports": {
        "maplibre-gl": "https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs",
        "pmtiles": "https://unpkg.com/pmtiles@4.5.0/dist/esm/index.js",
        "fflate": "https://unpkg.com/fflate@0.8.2/esm/browser.js"
      }
    }
  </script>
  <style>
    :root { --bg: turquoise; }
    html, body { width: 100%; height: 100%; margin: 0; background: var(--bg); }
    #map { position: absolute; inset: 0; background: transparent; }
    .panel {
      position: absolute; z-index: 2; color: #fff; background: rgba(0, 0, 0, 0.7);
      font: 14px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; padding: 8px 12px; max-width: 320px;
    }
    .panel h1 { font-size: 20px; margin: 0; }
    #title { top: 12px; left: 12px; }
    #zoom { bottom: 28px; left: 12px; font-variant-numeric: tabular-nums; }
    @media (max-width: 600px) { #title p { display: none; } }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel" id="title">
    <h1>Los Angeles buildings and parcels</h1>
    <p>Small buildings are dark, larger buildings are lighter.<br>
       Parcels are the reverse: small parcels are light, larger parcels darker.</p>
  </div>
  <div class="panel" id="zoom"></div>
  <script type="module">
    import * as maplibregl from 'maplibre-gl';
    import { Protocol } from 'pmtiles';

    // ?background=<css color or hex>  (same parameter as the 2016 site)
    // ?tiles=<base url for the .pmtiles files>  (defaults to ./tiles/)
    const params = new URLSearchParams(location.search);
    const bg = params.get('background');
    if (bg && /^\w+$/.test(bg)) {
      for (const c of [bg, '#' + bg]) if (CSS.supports('color', c)) document.documentElement.style.setProperty('--bg', c);
    }
    const tilesBase = (params.get('tiles') || new URL('tiles/', location.href).href).replace(/\/?$/, '/');

    const protocol = new Protocol();
    maplibregl.addProtocol('pmtiles', protocol.tile);

    // Original 2016 palette: ColorBrewer Greys, 7 quantile classes on area.
    const GREYS = ['#252525', '#525252', '#737373', '#969696', '#BDBDBD', '#D9D9D9', '#F7F7F7'];
    // Raster tiles are 512 px images, and each zoom level is a box-filtered half of the next.
    // MapLibre uploads them with mipmaps but samples LINEAR_MIPMAP_NEAREST, which snaps to
    // one mip level: where a tile is drawn shrunk past ~1.4x the GPU jumps to the half-size
    // copy and the map visibly softens at a fixed zoom. Trilinear filtering blends the two
    // levels instead, so sharpness changes continuously.
    (function preferTrilinear() {
      for (const C of [window.WebGLRenderingContext, window.WebGL2RenderingContext]) {
        if (!C) continue;
        const orig = C.prototype.texParameteri;
        C.prototype.texParameteri = function (target, pname, param) {
          if (pname === this.TEXTURE_MIN_FILTER && param === this.LINEAR_MIPMAP_NEAREST) param = this.LINEAR_MIPMAP_LINEAR;
          return orig.call(this, target, pname, param);
        };
      }
    })();
    // Pick the tile slot size so tiles are always drawn between 1x and 2x shrunk on this
    // screen (never enlarged below z14): MapLibre then hands off between levels exactly where
    // the finer level's half-size copy equals the coarser level, so the switch is invisible.
    const rasterTileSize = () => 512 / (window.devicePixelRatio * Math.SQRT2);
    const byClass = (colors) => ['match', ['get', 'c'], ...colors.flatMap((c, i) => [i, c]), colors[0]];

    // Pre-rendered (supersampled) raster below SWITCH_ZOOM, vector at and above it.
    // A hard switch, not a crossfade: semi-transparent fills let the background
    // color wash through the whole map mid-fade. The z14 raster tiles are @2x,
    // so they stay crisp up to the switch.
    const SWITCH_ZOOM = 14.5;

    const map = new maplibregl.Map({
      container: 'map',
      hash: true,
      center: [-118.30, 34.06],
      zoom: 12,
      minZoom: 9,
      maxZoom: 19,
      attributionControl: { customAttribution: 'Map by <a href="https://stamen.com">Stamen Design</a>' },
      style: {
        version: 8,
        sources: {
          lowzoom: { type: 'raster', url: `pmtiles://${tilesBase}la-raster.pmtiles`, tileSize: rasterTileSize() },
          features: { type: 'vector', url: `pmtiles://${tilesBase}la-vector.pmtiles` },
        },
        // No background layer: the canvas stays transparent and the page color shows through.
        layers: [
          {
            id: 'lowzoom', type: 'raster', source: 'lowzoom', maxzoom: SWITCH_ZOOM,
            paint: {
              'raster-resampling': 'linear', 'raster-fade-duration': 0,
            },
          },
          {
            id: 'parcels', type: 'fill', source: 'features', 'source-layer': 'parcels', minzoom: SWITCH_ZOOM,
            paint: { 'fill-color': byClass([...GREYS].reverse()) },
          },
          {
            id: 'buildings', type: 'fill', source: 'features', 'source-layer': 'buildings', minzoom: SWITCH_ZOOM,
            paint: { 'fill-color': byClass(GREYS) },
          },
        ],
      },
    });
    window.__map = map; // for screenshot.mjs

    // Rebuild the raster source if the window moves to a screen with a different density.
    (function watchDensity() {
      const mq = window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
      mq.addEventListener('change', () => {
        const size = rasterTileSize();
        const src = map.getSource('lowzoom');
        if (src && src.tileSize !== size) {
          const layer = map.getStyle().layers.find((l) => l.id === 'lowzoom');
          const spec = { ...map.getStyle().sources.lowzoom, tileSize: size };
          const before = map.getStyle().layers[map.getStyle().layers.indexOf(layer) + 1]?.id;
          map.removeLayer('lowzoom'); map.removeSource('lowzoom');
          map.addSource('lowzoom', spec); map.addLayer(layer, before);
        }
        watchDensity();
      }, { once: true });
    })();
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
    map.addControl(new maplibregl.ScaleControl());
    const zoomEl = document.getElementById('zoom');
    const showZoom = () => { zoomEl.textContent = `z${map.getZoom().toFixed(2)}`; };
    map.on('zoom', showZoom); map.on('load', showZoom);
  </script>
</body>
</html>
